[project]
name = "web-reporting-builder"
version = "0.1.0a1"
description = "Independent Django visual report builder with portable report projects"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "django>=5.2,<5.3", "sqlalchemy>=2.0,<2.1", "openpyxl>=3.1,<4",
  "cryptography>=44", "pillow>=11", "python-dotenv>=1", "httpx>=0.28",
  "whitenoise>=6.9", "gunicorn>=23; sys_platform != 'win32'", "markdown>=3.7",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
mariadb = ["pymysql>=1.1"]
oracle = ["oracledb>=3"]
mssql = ["pyodbc>=5"]
sheets = ["google-auth>=2.38", "requests>=2.32"]
pdf = ["playwright>=1.51"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.10",
    "ruff>=0.11",
    "playwright>=1.51",
    "pypdf>=5",
]

[project.scripts]
webreport = "reportbuilder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reportbuilder", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
