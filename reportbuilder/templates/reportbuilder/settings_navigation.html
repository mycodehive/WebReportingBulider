<header class="settings-heading"><h1>환경설정</h1><p class="muted">회사 기본정보와 사이트 운영 설정을 관리합니다.</p></header>
<nav class="settings-tabs" aria-label="환경설정 분류">
  {% for section in settings_sections %}<a href="{{ section.url }}" title="{{ section.label }}" {% if section.active %}class="active" aria-current="page"{% endif %}>{{ section.label }}</a>{% endfor %}
</nav>
<nav class="settings-submenu" aria-label="선택한 설정의 하위 메뉴">
  {% for child in settings_children %}<a href="{{ child.url }}" title="{{ child.label }}" {% if child.active %}class="active" aria-current="page"{% endif %}>{{ child.label }}</a>{% endfor %}
</nav>
