<meta name="description" content="{{ seo.description }}">
{% if seo.keywords %}<meta name="keywords" content="{{ seo.keywords }}">{% endif %}
<meta name="robots" content="{{ seo.robots }}">
{% if seo.canonical %}<link rel="canonical" href="{{ seo.canonical }}"><meta property="og:url" content="{{ seo.canonical }}">{% endif %}
<meta property="og:type" content="website">
<meta property="og:title" content="{{ seo.og_title }}">
<meta property="og:description" content="{{ seo.og_description }}">
{% if seo.og_image %}<meta property="og:image" content="{{ seo.og_image }}">{% endif %}
<meta name="twitter:card" content="{% if seo.og_image %}summary_large_image{% else %}summary{% endif %}">
<meta name="twitter:title" content="{{ seo.og_title }}">
<meta name="twitter:description" content="{{ seo.og_description }}">
{% if seo.og_image %}<meta name="twitter:image" content="{{ seo.og_image }}">{% endif %}
{% if seo.google_verification %}<meta name="google-site-verification" content="{{ seo.google_verification }}">{% endif %}
{% if seo.naver_verification %}<meta name="naver-site-verification" content="{{ seo.naver_verification }}">{% endif %}
