{% extends 'reportbuilder/base.html' %}
{% block content %}<section class="community-page community-editor-page"><div class="card community-card"><h1>삭제 확인</h1><h2>{{ label }}</h2><p>{% if post %}게시글과 답변 / 댓글을 삭제합니다.{% else %}게시판의 모든 게시글, 답변, 카테고리와 상태를 함께 삭제합니다.{% endif %} 삭제한 내용은 복구할 수 없습니다.</p><form method="post" class="community-actions">{% csrf_token %}<button class="button button-primary" type="submit">삭제</button><a class="button button-secondary" href="{% if post %}{% url 'board_post' board.id post.id %}{% else %}{% url 'board_settings' board.id %}{% endif %}">취소</a></form></div></section>{% endblock %}
