{% extends 'reportbuilder/base.html' %}{% block title %}로그인 · WebReportingBuilder{% endblock %}{% block content %}
<div class="login-wrap"><div class="card login-card"><span class="badge">WebReportingBuilder</span><h1>보고서 작업을 시작하세요.</h1><p class="muted">데이터를 연결하고, 캔버스에 배치하고, 어디서든 사용하세요.</p>
{% if form.errors %}<div class="alert">사용자 이름과 비밀번호를 확인해 주세요.</div>{% endif %}<form method="post">{% csrf_token %}<div class="field"><label for="id_username">사용자 이름</label><input class="input" id="id_username" name="username" autocomplete="username" required autofocus></div><div class="field"><label for="id_password">비밀번호</label><input class="input" id="id_password" name="password" type="password" autocomplete="current-password" required></div><input type="hidden" name="next" value="{{ next }}"><button class="button button-primary" type="submit">로그인</button></form></div></div>{% endblock %}
