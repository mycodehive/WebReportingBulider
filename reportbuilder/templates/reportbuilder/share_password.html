{% load static %}<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공유 보고서 비밀번호</title><link rel="stylesheet" href="{% static 'reportbuilder/app.css' %}"></head><body><main class="card login-card"><h1>비밀번호로 보고서 열기</h1><p class="muted">공유한 사람에게 받은 비밀번호를 입력하세요.</p>{% if error %}<p class="alert alert-danger" role="alert">{{ error }}</p>{% endif %}<form method="post">{% csrf_token %}<label class="field">공유 비밀번호<input class="input" type="password" name="password" required maxlength="128" autocomplete="current-password" autofocus></label><button class="button button-primary" type="submit">보고서 열기</button></form></main></body></html>
